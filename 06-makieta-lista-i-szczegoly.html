<title>Makieta Q4Rail ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: dark brand sidebar + white top bar; spreadsheet grid fills the workspace, "Na dziś" rail on the right; details = sticky header + tabs. Deliberately light-only (Excel fills carry meaning). */
:root{
  color-scheme: light;
  --ink:#15171A; --ink-2:#24272B; --sb-text:#D6D8DB; --sb-muted:#8C9096;
  --canvas:#F3F3F1; --surface:#FFFFFF; --zebra:#F3F7FC; --line:#E4E5E2; --line-2:#CFD2CE;
  --text:#1C1E21; --muted:#6A6E73; --faint:#9A9EA3;
  --accent:#FF6A3D; --accent-hover:#F2582A; --accent-soft:#FFE7DE; --on-accent:#FFFFFF;
  --rev:#1D5FC4; --cost:#BF3328;
  --f-blue:#CFE0F6; --f-lgreen:#D9F1D0; --f-green:#8FD38B; --f-green-ink:#0F3B12;
  --f-yellow:#FFEE9C; --f-purple:#E4D4F6; --f-red:#F6C3BC;
  --hover:#EAF1FB; --sel:#DCE8F9;
  --ok:#2D8A47; --ok-dark:#1E5E31; --warn:#C27C00; --warn-soft:#FFF4D6; --danger:#BF3328;
  --u-MS:#138A84; --u-JK:#D9731C; --u-KS:#7A4FD0; --u-PR:#2F6FD6; --u-MT:#D2477F; --u-BS:#5B6470;
  --font-ui:'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --sbw:212px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--canvas);color:var(--text);font-family:var(--font-ui);font-size:13px;overflow:hidden;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--rev);outline-offset:1px}
.mono{font-family:var(--font-mono);font-size:12px}
.muted{color:var(--muted)}
.app{display:grid;grid-template-columns:var(--sbw) 1fr;height:100%}
.app.collapsed{--sbw:56px}

/* Sidebar */
.sb{background:var(--ink);color:var(--sb-text);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.brand{height:52px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--ink-2)}
.brand .wm{font-weight:800;font-size:19px;letter-spacing:-.02em;color:#fff;white-space:nowrap}
.brand .wm b{color:var(--accent);font-weight:800}
.brand small{display:block;font-size:8.5px;letter-spacing:.32em;color:var(--sb-muted);font-weight:600;margin-top:-2px}
.nav{display:flex;flex-direction:column;gap:2px;padding:10px 8px;flex:1;overflow:auto}
.nav button{display:flex;align-items:center;gap:11px;background:none;border:0;color:var(--sb-text);padding:8px 10px;border-radius:6px;text-align:left;white-space:nowrap;font-size:13px}
.nav button:hover{background:var(--ink-2);color:#fff}
.nav button.on{background:var(--ink-2);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.nav svg{flex:none;width:18px;height:18px}
.nav .cnt{margin-left:auto;background:var(--accent);color:var(--on-accent);font-size:10.5px;font-weight:700;border-radius:9px;padding:1px 6px}
.nav .sep{height:1px;background:var(--ink-2);margin:6px 4px}
.sb-foot{padding:10px 8px;border-top:1px solid var(--ink-2)}
.sb-foot button{background:none;border:0;color:var(--sb-muted);display:flex;gap:10px;align-items:center;padding:6px 10px;white-space:nowrap}
.app.collapsed .nav .lbl,.app.collapsed .nav .cnt,.app.collapsed .brand .txt,.app.collapsed .sb-foot .lbl{display:none}
.app.collapsed .brand{padding:0 12px}

/* Top bar */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{height:52px;flex:none;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 16px}
.search{flex:1;max-width:460px;position:relative}
.search input{width:100%;height:34px;border:1px solid var(--line-2);border-radius:7px;padding:0 12px 0 34px;background:var(--canvas)}
.search svg{position:absolute;left:10px;top:9px;width:16px;height:16px;color:var(--muted)}
.search kbd{position:absolute;right:8px;top:8px;font-size:10.5px;border:1px solid var(--line-2);border-radius:4px;padding:0 5px;color:var(--muted);background:var(--surface)}
.top .sp{flex:1}
.btn{height:32px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12.5px;white-space:nowrap}
.btn:hover{background:var(--canvas)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.primary[aria-disabled="true"]{background:var(--line);border-color:var(--line-2);color:var(--faint);cursor:not-allowed}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--canvas)}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn.danger{color:var(--danger)}
.iconbtn{width:34px;height:34px;border-radius:7px;border:0;background:none;display:grid;place-items:center;position:relative;color:var(--text)}
.iconbtn:hover{background:var(--canvas)}
.iconbtn svg{width:19px;height:19px}
.iconbtn .dot{position:absolute;top:3px;right:2px;background:var(--accent);color:var(--on-accent);font-size:10px;font-weight:700;border-radius:8px;padding:0 5px;line-height:15px}
.me{display:flex;align-items:center;gap:8px;border:0;background:none;padding:3px 6px;border-radius:7px}
.me:hover{background:var(--canvas)}
.me .who{text-align:left;line-height:1.15}
.me .who b{display:block;font-size:12.5px}
.me .who span{font-size:11px;color:var(--muted)}

/* Badges & chips */
.op{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.02em;flex:none}
.op.lg{width:32px;height:32px;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:4px;height:20px;border-radius:10px;padding:0 8px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.st-Nowe{background:#ECEDEB;color:#4C5055}
.st-Zaplanowane{background:var(--f-blue);color:#174A8F}
.st-Podjęte{background:var(--f-lgreen);color:#2E6A21}
.st-Wdrodze{background:#BFE6BC;color:#1F5A1C}
.st-Dojeżdża{background:var(--f-yellow);color:#6E5600}
.st-Zakończone{background:var(--f-green);color:var(--f-green-ink)}
.st-Anulowane{background:#ECEDEB;color:#83878C;text-decoration:line-through}
.rz-Dozafakturowania{border-color:var(--line-2);color:var(--muted);background:var(--surface)}
.rz-Zafakturowane{background:#DDF3DC;color:#1F6B26;border-color:#A9DCA7}
.rz-Kosztyniekompletne{background:#FFE6CC;color:#9A4A00}
.rz-Rozliczone{background:var(--ok);color:#fff}
.rz-Miesiączamknięty{background:var(--ok-dark);color:#fff}
.tchip{display:inline-flex;height:20px;align-items:center;padding:0 7px;border-radius:4px;background:var(--canvas);border:1px solid var(--line-2);font-size:11.5px;font-weight:700;letter-spacing:.02em}
.flag{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:4px;font-size:11.5px;font-weight:600}
.flag i{width:10px;height:10px;border-radius:2px;display:inline-block}
.warn-ic{color:var(--warn);font-weight:700;cursor:help}

/* List view */
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.lhead{flex:none;background:var(--surface);padding:12px 16px 0;display:flex;flex-direction:column;gap:10px}
.ltitle{display:flex;align-items:baseline;gap:12px}
.ltitle h1{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:0}
.ltitle .meta{color:var(--muted);font-size:12px}
.vtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.vtabs button{background:none;border:0;padding:8px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-size:12.5px}
.vtabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.vtabs button .n{font-size:11px;color:var(--faint);margin-left:4px;font-weight:600}
.vtabs .save{color:var(--rev)}
.fbar{flex:none;background:var(--surface);padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.fbar select,.fbar input[type=date],.fbar input[type=text]{height:28px;border:1px solid var(--line-2);border-radius:6px;padding:0 8px;background:var(--surface);font-size:12px}
.fbar input[type=text]{width:170px}
.fbar .grp{display:flex;align-items:center;gap:4px}
.fbar .lab{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.opsel{display:flex;gap:3px}
.opsel button{border:0;padding:0;background:none;border-radius:50%;opacity:.32;transition:opacity .12s}
.opsel button.on{opacity:1}
.fbar .sp{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 8px;background:var(--surface)}
.chips:empty{display:none}
.fchip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 4px 0 10px;border-radius:12px;background:var(--sel);color:#16407A;font-size:12px;font-weight:600}
.fchip button{border:0;background:none;width:18px;height:18px;border-radius:50%;color:inherit;font-size:14px;line-height:1}
.fchip button:hover{background:#C3D6F2}
.work{flex:1;min-height:0;display:flex;position:relative}
.gridwrap{flex:1;min-width:0;overflow:auto;background:var(--surface);position:relative}
table.grid{border-collapse:separate;border-spacing:0;table-layout:fixed}
.grid th,.grid td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0 7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid thead th{background:#F7F7F5;font-weight:700;font-size:11.5px;text-align:left;color:#3A3D41}
.grid tr.g th{position:sticky;top:0;height:22px;z-index:3;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-bottom:1px solid var(--line-2)}
.grid tr.g th.g-Przychody{color:var(--rev);background:#EEF4FC}
.grid tr.g th.g-Koszty{color:var(--cost);background:#FCF0EE}
.grid tr.c th{position:sticky;top:22px;height:40px;z-index:3;white-space:normal;line-height:1.15;vertical-align:middle;border-bottom:1px solid var(--line-2)}
.grid tr.c th .hd{display:flex;align-items:center;gap:3px}
.grid tr.c th .hl{flex:1;cursor:pointer;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.grid tr.c th .fi{opacity:.35;border:0;background:none;padding:2px;border-radius:3px;line-height:0;flex:none}
.grid tr.c th:hover .fi{opacity:.8}
.grid tr.c th .fi:hover{background:var(--line)}
.grid tr.c th .fi svg{width:11px;height:11px}
.grid tr.c th .so{font-size:10px;color:var(--rev)}
.grid .pin{position:sticky}
.grid td.pin{z-index:1}
.grid thead tr th.pin{z-index:6}
.grid .pinlast{box-shadow:2px 0 0 var(--line-2)}
.grid td{height:32px;background:var(--surface)}
.grid tbody tr:nth-child(even) td{background:var(--zebra)}
.grid tbody tr:hover td{background:var(--hover)}
.grid tbody tr.sel td{background:var(--sel)}
.grid tbody tr td.f-blue{background:var(--f-blue)}
.grid tbody tr td.f-lgreen{background:var(--f-lgreen)}
.grid tbody tr td.f-green{background:var(--f-green);color:var(--f-green-ink)}
.grid tbody tr td.f-yellow{background:var(--f-yellow)}
.grid tbody tr td.f-purple{background:var(--f-purple)}
.grid tbody tr td.f-red{background:var(--f-red)}
.grid tbody tr{cursor:default}
.grid td.num{text-align:right}
.grid td.c{text-align:center}
.dash{display:block;text-align:center;color:var(--faint)}
.rev{color:var(--rev)}
.cost{color:var(--cost);font-weight:700}
.rez{font-style:italic;font-weight:400;text-decoration:underline dotted;text-underline-offset:3px}
.neg{color:var(--danger);font-weight:700}
.b{font-weight:700}
.grid tbody tr.cancel td{color:var(--faint);text-decoration:line-through;background:#F6F6F5}
.grid td.edit{padding:0;outline:2px solid var(--rev);outline-offset:-2px}
.grid td.edit input{width:100%;height:30px;border:0;padding:0 6px;background:#fff;font-size:12.5px;text-align:inherit}
.lock{font-size:10px}
.empty-row td{text-align:center;color:var(--muted);height:80px}

/* Na dziś panel */
.today{width:308px;flex:none;border-left:1px solid var(--line);background:var(--canvas);display:flex;flex-direction:column;min-height:0}
.today[hidden]{display:none}
.today header{padding:12px 14px 8px;display:flex;align-items:center;gap:8px}
.today header h2{font-size:14px;font-weight:800;margin:0}
.today header .d{color:var(--muted);font-size:11.5px}
.today header .sp{flex:1}
.today .seg{display:flex;margin:0 14px 8px;background:var(--line);border-radius:7px;padding:2px}
.today .seg button{flex:1;border:0;background:none;border-radius:5px;padding:4px;font-size:12px;font-weight:600;color:var(--muted)}
.today .seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 1px rgba(0,0,0,.06)}
.alerts{flex:1;overflow:auto;padding:0 14px 14px;display:flex;flex-direction:column;gap:8px}
.al{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;display:grid;grid-template-columns:auto 1fr;gap:3px 9px}
.al .sev{grid-row:1/4;width:8px;height:8px;border-radius:50%;margin-top:5px}
.al .t{font-weight:700;font-size:12.5px;line-height:1.3}
.al .m{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11.5px}
.al .go{display:flex;justify-content:space-between;align-items:center}
.al .go button{border:0;background:none;color:var(--rev);font-weight:700;font-size:12px;padding:0}
.sev-h{background:var(--danger)}.sev-m{background:var(--warn)}.sev-i{background:var(--rev)}

/* Drawer */
.drawer{position:absolute;top:0;right:0;bottom:0;width:440px;max-width:100%;background:var(--surface);border-left:1px solid var(--line-2);box-shadow:-12px 0 28px rgba(20,22,26,.12);z-index:20;display:flex;flex-direction:column}
.drawer[hidden]{display:none}
.drawer .dh{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.drawer .db{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:14px;flex:1}
.drawer .df{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kv>div{padding:6px 10px;border-bottom:1px solid var(--line);min-width:0;overflow:hidden;text-overflow:ellipsis}
.kv>div:nth-child(odd){color:var(--muted);font-size:12px;background:#FAFAF9}
.kv>div:nth-last-child(-n+2){border-bottom:0}

/* Popovers & menus */
.pop{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line-2);border-radius:9px;box-shadow:0 10px 30px rgba(20,22,26,.16);padding:6px;min-width:220px;max-height:70vh;overflow:auto}
.pop[hidden]{display:none}
.pop .mi{display:flex;width:100%;align-items:center;gap:8px;border:0;background:none;text-align:left;padding:7px 10px;border-radius:6px;font-size:12.5px}
.pop .mi:hover{background:var(--hover)}
.pop .mh{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:6px 10px 2px;font-weight:700}
.pop .val{font-weight:700;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{width:560px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.legend h3{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.legend table{border-collapse:collapse;width:100%;font-size:12px}
.legend td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.legend td:first-child{width:150px}
.sw{display:inline-block;width:42px;height:16px;border-radius:3px;border:1px solid rgba(0,0,0,.08);vertical-align:middle;margin-right:6px}
.colpick{width:300px}
.colpick label{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:5px;font-size:12.5px}
.colpick label:hover{background:var(--hover)}
.colpick label span{flex:1}
.colpick .mv{border:0;background:none;color:var(--faint);padding:0 3px;font-size:12px}
.colpick .mv:hover{color:var(--text)}

/* Details */
.detail{flex:1;min-height:0;overflow:auto}
.dhead{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 20px 0;display:flex;flex-direction:column;gap:10px}
.crumb{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.crumb button{border:0;background:none;color:var(--rev);font-weight:600;padding:0}
.drow{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.dtitle{flex:1;min-width:300px;display:flex;flex-direction:column;gap:8px}
.dtitle .l1{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dtitle h1{margin:0;font-family:var(--font-mono);font-size:24px;font-weight:600;letter-spacing:-.01em}
.dtitle .client{font-size:15px;font-weight:700}
.dtitle .l2{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sum{display:grid;grid-template-columns:repeat(4,auto);gap:0;border:1px solid var(--line);border-radius:9px;overflow:visible;position:relative}
.sum>div{padding:8px 14px;border-right:1px solid var(--line);min-width:110px}
.sum>div:last-child{border-right:0}
.sum .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.sum .v{font-size:16px;font-weight:800;margin-top:2px;white-space:nowrap}
.sum .tip{position:absolute;top:calc(100% + 6px);right:0;width:340px;background:var(--ink);color:#EDEEF0;border-radius:8px;padding:10px 12px;font-size:12px;z-index:30;display:none}
.sum:hover .tip{display:block}
.tip table{width:100%;border-collapse:collapse}
.tip td{padding:2px 4px}
.tip td:not(:first-child){text-align:right}
.steprow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;flex:1;min-width:520px}
.step{display:flex;align-items:center;gap:7px;flex:1;font-size:12px;font-weight:600;color:var(--faint);white-space:nowrap}
.step .c{width:20px;height:20px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;font-size:10px;flex:none;background:var(--surface)}
.step .bar{flex:1;height:2px;background:var(--line-2);min-width:12px}
.step.done{color:var(--text)}
.step.done .c{background:var(--ink);border-color:var(--ink);color:#fff}
.step.done .bar{background:var(--ink)}
.step.cur{color:var(--text)}
.step.cur .c{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
.step.cur .c::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.step:last-child{flex:none}
.acts{display:flex;gap:6px;align-items:center;position:relative}
.reqtip{position:absolute;top:calc(100% + 6px);left:0;background:var(--ink);color:#EDEEF0;border-radius:8px;padding:10px 12px;font-size:12px;width:260px;z-index:30;display:none}
.reqtip ul{margin:4px 0 0;padding-left:16px}
.pwrap{position:relative}
.pwrap:hover .reqtip{display:block}
.dtabs{display:flex;gap:2px;margin-top:2px;overflow-x:auto}
.dtabs button{background:none;border:0;padding:9px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-size:13px}
.dtabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.dtabs .n{font-size:11px;color:var(--faint);margin-left:3px}
.dbody{padding:16px 20px 40px;display:flex;flex-direction:column;gap:16px;max-width:1400px}
.banner{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:8px;font-size:12.5px}
.banner.warn{background:var(--warn-soft);border:1px solid #F1D48A;color:#6B4800}
.banner.info{background:#EAF1FB;border:1px solid #C9DBF4;color:#16407A}
.banner.lock{background:#E5F1E8;border:1px solid #B9D9C1;color:var(--ok-dark)}
.banner.cancel{background:#F1F1F0;border:1px solid var(--line-2);color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}

/* ---------- cell logic: status -> colours ---------- */
function sIdx(o){return STATUSES.indexOf(o.status)}
function fill(o,c){
 if(o.status==='Anulowane')return '';
 const i=sIdx(o);
 switch(c.k){
  case 'got': if(o.status==='Zaplanowane')return 'f-blue'; if(i>=2)return 'f-lgreen'; return '';
  case 'etd': if(i>=3&&o.invoiced)return 'f-green'; if(o.status==='Zaplanowane'||o.status==='Podjęte')return 'f-blue'; if(i>=3)return 'f-lgreen'; return '';
  case 'pod': if(o.status==='Dojeżdża')return 'f-yellow'; if(o.status==='Zakończone')return 'f-green'; return '';
  case 'kont': if(o.soc)return 'f-yellow'; if(o.tl)return 'f-purple'; return '';
  case 'r_skl': return o.sklad?'f-red':'';
 }
 return '';
}
function valText(o,c){
 if(c.amt){const a=(c.amt==='r'?o.r:o.k)[c.sk];return a?fmtA(a):'-'}
 if(c.sup){const a=o.k[c.sup];return a?.d||'-'}
 if(c.wy){const x=calc(o);return fmtP(x[c.wy])}
 return o[c.k]||'-';
}
function sortVal(o,c){
 if(c.amt){const a=(c.amt==='r'?o.r:o.k)[c.sk];return a?a.v*RATES[a.c]:-1e12}
 if(c.wy)return calc(o)[c.wy];
 if(c.k==='status')return STATUSES.indexOf(o.status);
 return (valText(o,c)==='-'?'￿':valText(o,c)).toLowerCase();
}
function cellHtml(o,c){
 switch(c.k){
  case 'op': return opBadge(o.op);
  case 'status': return stChip(o.status);
  case 'rozl': return rzChip(o.rozl);
  case 'nr': return `<span class="mono" style="font-weight:600">${esc(o.nr)}</span>${o.warn?` <span class="warn-ic" title="${esc(o.warn)}">⚠</span>`:''}`;
  case 'kont': { if(!o.kont)return dash; const bold=sIdx(o)>=3&&!o.lcl; return `<span class="mono${bold?' b':''}">${esc(o.kont)}</span>${o.soc?' <span class="muted" style="font-size:10.5px;font-weight:700">SOC</span>':''}`;}
 }
 if(c.amt){const a=(c.amt==='r'?o.r:o.k)[c.sk];if(!a)return dash;
   return c.amt==='r'?`<span class="rev">${fmtA(a)}</span>`:`<span class="cost${a.s==='rez'?' rez':''}" title="${a.s==='rez'?'Rezerwa – brak faktury kosztowej':'Faktura kosztowa '+(a.inv||'')}">${fmtA(a)}</span>`;}
 if(c.sup){const a=o.k[c.sup];return a?.d?esc(a.d):dash}
 if(c.wy){const x=calc(o);if(!Object.keys(o.r).length&&!Object.keys(o.k).length)return dash;const v=x[c.wy];
   if(c.wy==='p')return v<0?`<span class="neg">▼ ${fmtP(v)}</span>`:`<span class="b">${fmtP(v)}</span>`;return fmtP(v)}
 const v=o[c.k];if(!v)return dash;
 return c.mono?`<span class="mono">${esc(v)}</span>`:esc(v);
}

/* ---------- filtering ---------- */
const TABS=[
 {id:'mine',l:'Moje otwarte',f:o=>o.op===S.me&&OPEN.includes(o.status)},
 {id:'all-open',l:'Wszystkie otwarte',f:o=>OPEN.includes(o.status)},
 {id:'etd-today',l:'Wyjeżdżają dziś',f:o=>o.etd===TODAY&&o.status!=='Anulowane'},
 {id:'to-close',l:'Do zamknięcia',f:o=>o.status==='Zakończone'&&o.rozl!=='Miesiąc zamknięty'},
 {id:'done',l:'Zrealizowane',f:o=>o.status==='Zakończone'||o.status==='Anulowane'},
];
function baseRows(){return ORDERS.filter(o=>S.role!=='bs'||o.shanghai||['QAR100238','QAR100240'].includes(o.id))}
function rows(){
 const t=TABS.find(t=>t.id===S.tab);
 let r=baseRows().filter(t.f);
 if(S.ops.size)r=r.filter(o=>S.ops.has(o.op));
 if(S.klient)r=r.filter(o=>o.klient===S.klient);
 if(S.t1)r=r.filter(o=>o.t1===S.t1);
 if(S.status)r=r.filter(o=>o.status===S.status);
 if(S.rozl)r=r.filter(o=>o.rozl===S.rozl);
 if(S.etdFrom)r=r.filter(o=>o.etd&&o.etd>=S.etdFrom);
 if(S.etdTo)r=r.filter(o=>o.etd&&o.etd<=S.etdTo);
 for(const ch of S.vchips){const c=COLS.find(c=>c.k===ch.k);r=r.filter(o=>valText(o,c)===ch.v)}
 if(S.text){const q=S.text.toLowerCase();r=r.filter(o=>[o.nr,o.kont,o.klient,o.ref,o.fv,o.uwagi,o.kdrob].join(' ').toLowerCase().includes(q))}
 if(S.sort){const c=COLS.find(c=>c.k===S.sort.k);r=[...r].sort((a,b)=>{const x=sortVal(a,c),y=sortVal(b,c);return (x<y?-1:x>y?1:0)*S.sort.d})}
 return r;
}

 let body='';

 else{$('#vDetail').hidden=true;$('#vList').hidden=false;S.curDetail=null;renderList();setNav('zlecenia')}
}
function rerender(){route();if(!$('#drawer').hidden&&S.sel)openDrawer(S.sel)}

/* ---------- nav ---------- */
const NAV=[['zlecenia','Zlecenia','M4 6h16M4 12h16M4 18h16'],['nadzis','Na dziś','M12 7v5l3 2M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18'],['klienci','Klienci','M16 19v-1a4 4 0 0 0-8 0v1M12 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6M20 19v-1a3 3 0 0 0-2-2.8M4 19v-1a3 3 0 0 1 2-2.8'],['sep'],['konsole','Konsole','M3 8h18v10H3zM7 8v10M11 8v10M15 8v10M19 8v10'],['kontenery','Kontenery','M3 8l9-4 9 4v8l-9 4-9-4zM3 8l9 4 9-4M12 12v8'],['sep'],['fs','Faktury sprzedażowe','M6 3h9l4 4v14H6zM9 12h7M9 16h5'],['fk','Faktury kosztowe','M6 3h9l4 4v14H6zM9 12h7M9 16h7M9 8h3'],['kpd','Koszty poza spedycją','M4 20h16M7 17V9M12 17V5M17 17v-4'],['raporty','Raporty','M4 4v16h16M8 14l3-3 3 2 5-6'],['sep'],['slowniki','Słowniki','M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11'],['ustawienia','Ustawienia','M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2']];
function renderNav(){$('#nav').innerHTML=NAV.map(n=>n[0]==='sep'?'<div class="sep"></div>':`<button data-nav="${n[0]}" title="${n[1]}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="${n[2]}"/></svg><span class="lbl">${n[1]}</span>${n[0]==='nadzis'?'<span class="cnt">6</span>':''}</button>`).join('')}
function setNav(k){$('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.nav===k))}

/* ---------- toast ---------- */
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}

/* ---------- role ---------- */
function setRole(r){S.role=r;S.me={op:'KS',mgr:'MS',bs:'BS'}[r];
 $('#meBadge').textContent=S.me==='BS'?'SH':S.me;$('#meBadge').style.background=`var(--u-${S.me})`;
 $('#meName').textContent={op:'KS · Opiekun',mgr:'Marcin S. · Zarząd',bs:'Biuro Szanghaj'}[r];
 $('#meRole').textContent='Podgląd jako: '+{op:'Opiekun',mgr:'Zarząd / kierownik',bs:'Biuro Szanghaj'}[r];
 $('#rolebar').hidden=r!=='bs';$('#today').hidden=r==='bs'?true:$('#today').hidden;
 if(r==='bs'){S.tab='all-open'}
 closeDrawerSilent();rerender();toast('Podgląd jako: '+{op:'Opiekun',mgr:'Zarząd / kierownik',bs:'Biuro Szanghaj'}[r]);
}
function closeDrawerSilent(){$('#drawer').hidden=true;S.sel=null}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const t=e.target;const c=s=>t.closest(s);
 if(!c('#pop')&&!c('[data-colf]')&&!c('#bLegend')&&!c('#bCols')&&!c('#me')&&!c('#bell'))hidePop();
 let el;
 if(el=c('[data-nav]')){const k=el.dataset.nav;if(k==='zlecenia')go('lista');else if(k==='nadzis'){go('lista');$('#today').hidden=false}else toast(`„${el.title}” – ekran poza zakresem tej makiety (5.1 i 5.2)`);return}
 if(el=c('[data-tab]')){if(el.dataset.tab==='save'){toast('Zapisano widok „Mój widok 1” (filtry, kolumny, sortowanie)');return}S.tab=el.dataset.tab;closeDrawerSilent();renderList();return}
 if(el=c('[data-op]')){const u=el.dataset.op;S.ops.has(u)?S.ops.delete(u):S.ops.add(u);renderOpSel();renderGrid();return}
 if(el=c('[data-chipx]')){const k=el.dataset.chipx;if(k==='all'){window._chipX.forEach(f=>f());S.vchips=[]}else window._chipX[+k]();renderOpSel();renderGrid();return}
 if(el=c('[data-sort]')){const k=el.dataset.sort;S.sort=S.sort?.k===k?(S.sort.d>0?{k,d:-1}:null):{k,d:1};renderGrid();return}
 if(el=c('[data-colf]')){e.stopPropagation();const col=COLS.find(x=>x.k===el.dataset.colf);const vals=[...new Set(rows().map(o=>valText(o,col)))].sort();const r=el.getBoundingClientRect();
   showPop(`<div class="mh">${esc(col.l)} · pokaż tylko</div>`+vals.slice(0,14).map(v=>`<button class="mi" data-vfilter="${esc(col.k)}" data-v="${esc(v)}"><span class="val">${esc(v)}</span></button>`).join('')+(S.sort?.k===col.k?'':`<div class="mh">Sortowanie</div><button class="mi" data-sortset="${col.k}:1">Sortuj rosnąco</button><button class="mi" data-sortset="${col.k}:-1">Sortuj malejąco</button>`),r.left,r.bottom+4);return}
 if(el=c('[data-vfilter]')){S.vchips.push({k:el.dataset.vfilter,v:el.dataset.v});hidePop();renderGrid();return}
 if(el=c('[data-sortset]')){const [k,d]=el.dataset.sortset.split(':');S.sort={k,d:+d};hidePop();renderGrid();return}
 if(el=c('[data-ctxopen]')){hidePop();go('zlecenie-'+el.dataset.ctxopen);return}
 if(el=c('[data-go]')){hidePop();closeDrawerSilent();go('zlecenie-'+el.dataset.go);return}
 if(el=c('[data-open]')){closeDrawerSilent();go('zlecenie-'+el.dataset.open);return}
 if(el=c('[data-close-drawer]')){closeDrawer();return}
 if(el=c('[data-go-list]')){go('lista');return}
 if(el=c('[data-mail]')){openMail(el.dataset.mail,el.dataset.tpl);return}
 if(el=c('[data-close-modal]')){$('#ovl').hidden=true;M=null;return}
 if(t.id==='ovl'){$('#ovl').hidden=true;M=null;return}
 if(el=c('[data-tpl-pick]')){M.tpl=el.dataset.tplPick;renderMail();return}
 if(t.id==='mSend'){sendMail();return}
 if(el=c('[data-dtab]')){S.dtab=el.dataset.dtab;renderDetail(S.curDetail);return}
 if(el=c('[data-advance]')){const o=byId(S.curDetail);if(el.dataset.advance==='acct'){o.k&&Object.values(o.k).forEach(a=>a.s='ksi');ensureHist(o);o.hist.push([TODAY+' '+nowT(),S.me,'Przekazano koszty do księgowości']);toast(`${o.nr}: przekazano do księgowości`)}else advance(o);renderDetail(o.id);return}
 if(el=c('[data-dup]')){const o=newOrder(byId(el.dataset.dup));toast(`Utworzono kopię: ${o.nr} (Nowe)`);go('zlecenie-'+o.id);return}
 if(c('[data-cancel-ask]')){$('#cancelConfirm').hidden=false;return}
 if(c('[data-cancel-no]')){$('#cancelConfirm').hidden=true;return}
 if(el=c('[data-cancel-yes]')){const o=byId(el.dataset.cancelYes);const f=o.status;o.status='Anulowane';ensureHist(o);o.hist.push([TODAY+' '+nowT(),S.me,`Status: <del>${f}</del> → Anulowane`]);toast(`${o.nr} anulowane`);renderDetail(o.id);return}
 if(el=c('[data-dashtg]')){const f=el.closest('.fld');const inp=f.querySelector('input,select');const on=!f.classList.contains('empty');f.classList.toggle('empty',on);if(on){inp.dataset.prev=inp.value;inp.value=''}else if(inp.dataset.prev)inp.value=inp.dataset.prev;return}
 if(el=c('[data-addrow]')){const tr=document.createElement('tr');const svc=`<select aria-label="Usługa">${Object.values(SVC).map(s=>`<option>${s}</option>`).join('')}</select>`;const cur=`<select aria-label="Waluta"><option>PLN</option><option>USD</option><option>EUR</option></select>`;
   tr.innerHTML=el.dataset.addrow==='R'?`<td>${svc}</td><td class="num"><input aria-label="Kwota" style="width:90px;text-align:right" placeholder="0,00"></td><td>${cur}</td><td><input aria-label="Uwagi" placeholder="-"></td><td><span class="chip rz-Dozafakturowania">Do zafakturowania</span></td>`:`<td>${svc}</td><td><select aria-label="Dostawca"><option>TL Log Transport</option><option>CelPort Agencja Celna</option><option>Cargo Protect</option><option>Magazyn DTA</option></select></td><td class="num"><input aria-label="Kwota" style="width:90px;text-align:right" placeholder="0,00"></td><td>${cur}</td><td><select aria-label="Status"><option>Rezerwa</option><option>Zarejestrowany</option></select></td><td>-</td><td><input aria-label="Uwagi" placeholder="-"></td>`;
   el.parentNode.insertBefore(tr,el);tr.querySelector('input').focus();return}
 if(el=c('[data-rcpx]')){const o=byId(S.curDetail);o.rcp.splice(+el.dataset.rcpx,1);renderDetail(o.id);return}
 if(t.id==='awGo'){const o=byId(S.curDetail);const s=$('#awTxt').value;
   const nm=s.match(/kierowca:\s*([A-ZŁŚŻŹĆ][\wąćęłńóśźż]+)\s+([A-ZŁŚŻŹĆ][\wąćęłńóśźż-]+)/);const tel=s.match(/(\+?\d[\d\s]{8,14}\d)/);
   const ci=s.match(/ciągnik:\s*([A-Z0-9 ]{4,10}?)(?=,|\n|$)/i);const na=s.match(/naczepa:\s*([A-Z0-9 ]{4,10}?)(?=,|\n|$)/i);const dt=s.match(/(\d{4}-\d{2}-\d{2}).*?(\d{1,2}:\d{2})/);const ms=s.match(/miejsce:\s*(.+)/i);
   o.awiz={imie:nm?.[1]||'',nazw:nm?.[2]||'',tel:tel?.[1]?.trim()||'',ciag:ci?.[1]?.trim()||'',nacz:na?.[1]?.trim()||'',dt:dt?`${dt[1]} ${dt[2]}`:'',msc:ms?.[1]?.trim()||''};
   renderDetail(o.id);const n=Object.values(o.awiz).filter(Boolean).length;$('#awNote').textContent=`Rozpoznano ${n} z 7 pól – sprawdź i zapisz.`;return}
 if(el=c('#bLegend')){const r=el.getBoundingClientRect();if(!$('#pop').hidden&&$('#pop').classList.contains('legend')){hidePop();return}showPop(legendHtml(),r.right-560,r.bottom+6,'legend');return}
 if(el=c('#bCols')){const r=el.getBoundingClientRect();if(!$('#pop').hidden&&$('#pop').classList.contains('colpick')){hidePop();return}showPop(colPickHtml(),r.right-300,r.bottom+6,'colpick');return}
 if(el=c('[data-mv]')){const [k,d]=el.dataset.mv.split(':').map(Number);const j=k+d;if(COLS[j]&&COLS[j].g===COLS[k].g&&COLS[j].pin===undefined){[COLS[k],COLS[j]]=[COLS[j],COLS[k]];renderGrid();const p=$('#pop');const st=p.scrollTop;p.innerHTML=colPickHtml();p.scrollTop=st}return}
 if(c('#bExport')){toast('Eksport do Excela: zlecenia_2026-11-05.xlsx (widok i filtry jak na ekranie)');return}
 if(c('#bToday')){$('#today').hidden=!$('#today').hidden;return}
 if(c('#todayClose')){$('#today').hidden=true;return}
 if(el=c('#todaySeg button')){S.todayScope=el.dataset.s;renderToday();return}
 if(c('#newOrder')){const o=newOrder();toast(`Utworzono ${o.nr} – uzupełnij dane zlecenia`);go('zlecenie-'+o.id);return}
 if(el=c('#me')){const r=el.getBoundingClientRect();showPop(`<div class="mh">Podgląd jako</div><button class="mi" data-role="op">${opBadge('KS')} Opiekun (KS)</button><button class="mi" data-role="mgr">${opBadge('MS')} Zarząd / kierownik (MS)</button><button class="mi" data-role="bs"><span class="op" style="background:var(--u-BS)">SH</span> Biuro Szanghaj</button><div class="mh">Konto</div><button class="mi">Ustawienia konta</button><button class="mi">Wyloguj</button>`,r.right-240,r.bottom+6);return}
 if(el=c('[data-role]')){hidePop();setRole(el.dataset.role);return}
 if(c('#roleBack')){setRole('op');return}
 if(el=c('#bell')){const r=el.getBoundingClientRect();showPop(`<div class="mh">Powiadomienia</div>`+ALERTS.map(a=>{const o=byId(a.id);return `<button class="mi" data-go="${o.id}"><span class="sev sev-${a.sev}" style="width:8px;height:8px;border-radius:50%;flex:none"></span><span><b class="mono">${esc(o.nr)}</b> · ${esc(a.t)}</span></button>`}).join(''),r.right-360,r.bottom+6);return}
 if(c('#collapse')){$('#app').classList.toggle('collapsed');return}
 // row click (delayed so double-click can edit)
 const td=c('#grid tbody td');
 if(td&&!td.classList.contains('edit')){const tr=td.parentNode;if(!tr.dataset.id)return;clearTimeout(window._rc);window._rc=setTimeout(()=>openDrawer(tr.dataset.id),td.dataset.edit?230:0)}
});
document.addEventListener('dblclick',e=>{
 const td=e.target.closest('#grid tbody td[data-edit]');if(!td||S.role==='bs')return;clearTimeout(window._rc);
 const o=byId(td.parentNode.dataset.id);const col=COLS.find(c=>c.k===td.dataset.k);
 let val;if(col.date)val=o[col.k];else{const a=(col.amt==='r'?o.r:o.k)[col.sk];val=a?String(a.v).replace('.',','):''}
 td.classList.add('edit');td.innerHTML=`<input type="${col.date?'date':'text'}" value="${esc(val)}" style="text-align:${col.date?'left':'right'}">`;const inp=td.querySelector('input');inp.focus();inp.select?.();
 const commit=ok=>{if(ok){if(col.date){o[col.k]=inp.value}else{const n=parseFloat(inp.value.replace(/\s/g,'').replace(',','.'));const box=col.amt==='r'?o.r:o.k;
   if(isNaN(n))delete box[col.sk];else if(box[col.sk])box[col.sk].v=n;else box[col.sk]=A(n,col.sk==='kol'?'USD':'PLN',col.amt==='k'?{s:'rez',d:SUPPLIERS[col.sk]||o.agent}:{});}
   ensureHist(o);o.hist.push([TODAY+' '+nowT(),S.me,`${col.l}: <del>${val||'-'}</del> → ${inp.value||'-'}`]);toast(`${o.nr}: zapisano ${col.l}`)}
  renderGrid()};
 inp.addEventListener('keydown',ev=>{if(ev.key==='Enter')commit(true);if(ev.key==='Escape'){inp.onblur=null;commit(false)}});
 inp.onblur=()=>commit(true);
});
document.addEventListener('contextmenu',e=>{
 const td=e.target.closest('#grid tbody td');if(!td||!td.parentNode.dataset.id)return;e.preventDefault();
 const o=byId(td.parentNode.dataset.id);const col=COLS.find(c=>c.k===td.dataset.k);const v=valText(o,col);
 showPop(`<div class="mh">${esc(col.l)}</div><button class="mi" data-vfilter="${col.k}" data-v="${esc(v)}">Pokaż tylko wiersze z tą wartością: <span class="val">${esc(v)}</span></button><button class="mi" data-ctxopen="${o.id}">Otwórz zlecenie ${esc(o.nr)}</button>${td.dataset.edit?`<button class="mi" onclick="hidePop();this.closest('body').querySelector('#grid tbody tr[data-id=&quot;${o.id}&quot;] td[data-k=&quot;${col.k}&quot;]').dispatchEvent(new MouseEvent('dblclick',{bubbles:true}))">Edytuj komórkę</button>`:''}`,e.clientX,e.clientY);
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='fKlient'){S.klient=t.value;renderGrid()} else if(t.id==='fTyp1'){S.t1=t.value;renderGrid()} else if(t.id==='fStatus'){S.status=t.value;renderGrid()} else if(t.id==='fRozl'){S.rozl=t.value;renderGrid()}
 else if(t.id==='fEtdFrom'){S.etdFrom=t.value;renderGrid()} else if(t.id==='fEtdTo'){S.etdTo=t.value;renderGrid()}
 else if(t.dataset.colon!==undefined){COLS[+t.dataset.colon].on=t.checked;renderGrid()}
 else if(t.dataset.att!==undefined){t.checked?M.att.add(+t.dataset.att):M.att.delete(+t.dataset.att);renderMail()}
 else if(t.dataset.cst){const o=byId(S.curDetail);const a=o.k[t.dataset.cst];a.s=t.value;if(t.value!=='rez'&&!a.inv)a.inv='FK/'+Math.floor(1000+Math.random()*8999);updRozl(o);ensureHist(o);o.hist.push([TODAY+' '+nowT(),S.me,`Koszt ${SVC[t.dataset.cst]}: status → ${t.selectedOptions[0].text}`]);renderDetail(o.id)}
 else if(t.dataset.flag){const o=byId(S.curDetail);o[t.dataset.flag]=t.checked;renderDetail(o.id)}
 else if(t.id==='c-ver'){const o=byId(S.curDetail);o.verified=t.checked}
 else if(t.dataset.k&&S.curDetail){const o=byId(S.curDetail);const k=t.dataset.k;if(['kont_nr','ctn','kg','cbm'].includes(k))return;const from=o[k];o[k]=t.value;
   if(k==='got'||k==='etd'){if(o.status==='Nowe'&&o.got&&o.etd)o.missing=[]}
   ensureHist(o);o.hist.push([TODAY+' '+nowT(),S.me,`${t.closest('.fld').querySelector('label').textContent}: <del>${from||'-'}</del> → ${t.value||'-'}`]);renderDetail(o.id)}
});
document.addEventListener('input',e=>{if(e.target.id==='fText'){S.text=e.target.value;renderGrid()}});
document.addEventListener('keydown',e=>{
 if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();$('#gsearch').focus()}
 if(e.key==='Escape'){hidePop();if(!$('#ovl').hidden){$('#ovl').hidden=true;M=null}else if(!$('#drawer').hidden)closeDrawer()}
 if(e.target.id==='gsearch'&&e.key==='Enter'){const q=e.target.value.trim().toLowerCase();const hit=ORDERS.find(o=>[o.nr,o.kont,o.ref].some(v=>v&&v.toLowerCase()===q));
   if(hit){go('zlecenie-'+hit.id)}else{S.text=e.target.value;$('#fText').value=S.text;S.tab=TABS.some(t=>t.id==='all-open')?'all-open':S.tab;go('lista');renderList()}}
 if(e.target.id==='rcpIn'&&e.key==='Enter'&&e.target.value.trim()){const o=byId(S.curDetail);o.rcp.push({a:e.target.value.trim()});renderDetail(o.id);$('#rcpIn').focus()}
});
// drag & drop documents
document.addEventListener('dragover',e=>{const d=e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest('#drop');if(d)d.classList.remove('over')});
function addFiles(files){const o=byId(S.curDetail);if(!o||!files.length)return;
 const guess=n=>/\.(jpe?g|png|heic)$/i.test(n)?'Zdjęcia z załadunku':/smgs|hbl/i.test(n)?'SMGS / HBL':/invoice|packing|faktura|ci_/i.test(n)?'Dokumenty handlowe':/tlumacz|transl/i.test(n)?'Tłumaczenie':/\.(eml|msg)$/i.test(n)?'Inne':'Inne';
 [...files].forEach(f=>o.docs.push({g:guess(f.name),n:f.name,by:S.role==='bs'?'Biuro Szanghaj':S.me,dt:TODAY}));
 ensureHist(o);o.hist.push([TODAY+' '+nowT(),S.role==='bs'?'BS':S.me,`Dodano ${files.length} plik(i)`]);renderDetail(o.id);toast(`Dodano ${files.length} plik(i) do ${o.nr}`)}
document.addEventListener('drop',e=>{const d=e.target.closest('#drop');if(d){e.preventDefault();addFiles(e.dataTransfer.files)}});
document.addEventListener('change',e=>{if(e.target.id==='fileIn')addFiles(e.target.files)});

/* ---------- init ---------- */
renderNav();fillSelects();renderOpSel();
addEventListener('hashchange',route);
route();
</script>
